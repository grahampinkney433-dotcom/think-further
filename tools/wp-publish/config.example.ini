; Copy this file to  config.ini  (in the same folder) and fill in your details.
; config.ini is git-ignored, so your password never gets pushed to GitHub.

[wordpress]
; Your site's home URL, no trailing slash.
site_url = https://alugence.ai

; Your wp-admin username (the person the Application Password belongs to).
username = your-wp-username

; The Application Password you generate in wp-admin (see README.md).
; Paste it WITH the spaces exactly as WordPress shows it, e.g.:
;   app_password = abcd EFGH ijkl MNOP qrst UVWX
app_password = xxxx xxxx xxxx xxxx xxxx xxxx
